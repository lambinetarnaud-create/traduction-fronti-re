<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="color-scheme" content="light only"/>
<meta name="theme-color" content="#1C2B4A"/>
<title>Page introuvable — Contrôle Frontière</title>
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png"/>
<link rel="stylesheet" href="fonts.css"/>
<style>
:root { color-scheme: light only; }
* { box-sizing:border-box; margin:0; padding:0; }
body { min-height:100vh; display:flex; align-items:center; justify-content:center;
  background:#F7F4EE; color:#1E2235; font-family:'DM Sans',sans-serif; padding:24px; text-align:center; }
.card { max-width:360px; }
.icon { font-size:3rem; margin-bottom:12px; }
h1 { font-family:'Playfair Display',serif; color:#1C2B4A; font-size:1.5rem; margin-bottom:8px; }
p { color:#5E6175; font-size:.95rem; line-height:1.6; margin-bottom:20px; }
a { display:inline-block; padding:12px 24px; border-radius:12px; background:#1C2B4A; color:#fff;
  text-decoration:none; font-weight:500; }
</style>
</head>
<body>
<div class="card">
  <div class="icon">🛂</div>
  <h1>Page introuvable</h1>
  <p>Cette page n'existe pas ou a été déplacée.</p>
  <a href="./">Retour à l'accueil</a>
</div>
</body>
</html>
